name: Deploy API

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        options:
          - dev
      seed:
        description: Create the super admin after deploying (first deploy of a fresh environment)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      TASK_FAMILY: ${{ vars.TASK_FAMILY }}
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
      SEED_TASK_FAMILY: ${{ vars.SEED_TASK_FAMILY }}
      SEED_CONTAINER_NAME: seed
      API_URL: ${{ vars.API_URL }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server_go/go.mod
          cache-dependency-path: server_go/go.sum

      - name: Vet and test
        working-directory: server_go
        run: |
          go vet ./...
          go test ./...

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tags are immutable, so redeploying a commit reuses its image instead of failing on push.
      - name: Resolve image
        id: image
        run: |
          echo "uri=${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.image.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: server_go
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Register task definition
        id: taskdef
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          arn=$(.github/scripts/register-revision.sh "$TASK_FAMILY" "$CONTAINER_NAME" "$IMAGE")
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
          echo "Registered $arn"

      # Runs before the rollout so new tasks never start against an old schema.
      - name: Run database migrations
        run: .github/scripts/run-one-off-task.sh "${{ steps.taskdef.outputs.arn }}" "$CONTAINER_NAME" '["/app/migrate", "up"]'

      - name: Deploy service
        env:
          TASK_DEFINITION: ${{ steps.taskdef.outputs.arn }}
        run: |
          desired=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].desiredCount' --output text)

          # Terraform creates the service at zero tasks; after that the count belongs to autoscaling.
          args=()
          if [ "$desired" = "0" ]; then
            args+=(--desired-count 1)
          fi

          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION" "${args[@]}" > /dev/null

          echo "Waiting for the rollout to finish..."
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

          # A circuit-breaker rollback also ends "stable", just on the previous revision.
          primary=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query "services[0].deployments[?status=='PRIMARY'].taskDefinition | [0]" --output text)

          if [ "$primary" != "$TASK_DEFINITION" ]; then
            echo "::error::Deployment was rolled back to $primary"
            exit 1
          fi

      - name: Smoke test
        run: curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "$API_URL/health"

      # After the rollout, because the API creates the SuperAdmin role when it boots.
      - name: Seed super admin
        if: inputs.seed
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          arn=$(.github/scripts/register-revision.sh "$SEED_TASK_FAMILY" "$SEED_CONTAINER_NAME" "$IMAGE")
          .github/scripts/run-one-off-task.sh "$arn" "$SEED_CONTAINER_NAME"
